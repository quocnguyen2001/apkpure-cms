name: CI

on:
  push:
    branches: [ develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3]

    name: P${{ matrix.php }} - S${{ matrix.stability }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: laravel
          MYSQL_ROOT_PASSWORD: root
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3
      - name: Verify MySQL connection
        run: mysql --host 127.0.0.1 --port ${{ job.services.mysql.ports['3306'] }} -uuser -psecret -e "SHOW DATABASES"
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: dependencies-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, gd
          coverage: none
          tools: composer:v2
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.github/.env.example', '.env');"
      - name: Install Dependencies
        run: composer update --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate --force
      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache
      - name: Prepare database
        run: |
          php artisan migrate --force
          php artisan cms:plugin:activate:all
          php artisan db:seed --force
          php artisan cms:theme:activate >/dev/null 2>&1 &
          php artisan optimize:clear
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: laravel
          DB_PORT: 33306
          DB_USER: user
          DB_PASSWORD: secret
      - name: Check PHP Coding Standard
        run: |
          composer require laravel/pint
          vendor/bin/pint platform database/seeders --test -v
      - name: Check PHP Mess Detector
        run: |
          composer require phpmd/phpmd
          vendor/bin/phpmd platform ansi .github/phpmd.xml --exclude "*/tests/*,*/Tests/*"
      - name: Run PHPUnit tests
        run: |
          php artisan migrate:fresh --force
          php artisan cms:plugin:activate:all
          php artisan test
          php artisan cms:plugin:deactivate:all
          php artisan test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: laravel
          DB_PORT: 33306
          DB_USER: user
          DB_PASSWORD: secret
