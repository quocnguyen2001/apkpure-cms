services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:8080"
    volumes:
      - ./:/var/www/html
    command: [ "php", "/var/www/html/artisan", "serve", "--host=0.0.0.0", "--port=8080" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      start_period: 10s
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql
    ports:
      - '${FORWARD_DB_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  worker:
    image: apkpure-app:latest
    command: [ "php", "/var/www/html/artisan", "horizon" ]
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "healthcheck-horizon" ]
      start_period: 10s

  scheduler:
    image: apkpure-app:latest
    command: [ "php", "/var/www/html/artisan", "schedule:work" ]
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "healthcheck-schedule" ]
      start_period: 10s

  playwright-scraper:
    build:
      context: ./docker/playwright
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./storage/scraper:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rustfs:
    image: 'rustfs/rustfs:latest'
    ports:
      - '${FORWARD_RUSTFS_PORT:-9000}:9000'
      - '${FORWARD_RUSTFS_ADMIN_PORT:-9001}:9001'
    environment:
      RUSTFS_VOLUMES: '/data'
      RUSTFS_ACCESS_KEY: 'rustfsadmin'
      RUSTFS_SECRET_KEY: 'rustfsadmin'
      RUSTFS_EXTERNAL_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
    volumes:
      - 'rustfs_data:/data'

volumes:
  db_data:
  redis_data:
  rustfs_data:
